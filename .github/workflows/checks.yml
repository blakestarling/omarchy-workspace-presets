name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Lua
        # The Lua quoting fuzz test parses generated literals with the real
        # interpreter, since that quoting is what keeps preset data out of
        # hyprctl repl's evaluator.
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Run tests
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s tests -v
      - name: Validate manifest JSON
        run: python -m json.tool manifest.json >/dev/null
